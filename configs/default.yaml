node_id: argus-edge-01
cameras:
- camera_id: c
  name: c
  source: "0"
  protocol: usb
  fps_target: 60
  resolution:
  - 1920
  - 1080
  zones: []
  reconnect_delay: 5.0
  max_reconnect_attempts: -1
  watchdog_timeout: 30.0
  mog2:
    history: 500
    var_threshold: 25.0
    detect_shadows: true
    change_pct_threshold: 0.005
    denoise: true
    enable_stabilization: true
    heartbeat_frames: 150
    lock_score_threshold: 0.85
    lock_clear_frames: 10
  alignment:
    enabled: true
    max_shift_px: 5.0
    downsample: 4
    ref_update_interval_s: 60.0
  scene_guard:
    enabled: true
    profiles_dir: data/scene_profiles
    reference_image: null
    fallback_to_baseline: false
    allow_alignable: false
    require_profile_model_binding: true
    require_operator_approved_profile: true
    process_width: 960
    feature_type: orb
    check_interval_frames: 60
    check_interval_seconds: 1.0
    consecutive_matches: 3
    min_matches: 40
    min_inliers: 18
    min_inlier_ratio: 0.45
    max_reprojection_error_px: 3.0
    min_coverage_ratio: 0.12
    min_overlap_ratio: 0.75
    stable_max_shift_px: 3.0
    stable_max_corner_displacement_px: 3.0
    stable_max_rotation_deg: 0.10
    stable_max_scale_delta: 0.003
    alignable_max_shift_px: 32.0
    alignable_max_rotation_deg: 3.0
    alignable_max_scale_delta: 0.05
  person_filter:
    confidence: 0.4
    skip_frame_on_person: false
    model_name: yolo11n.pt
    classes_to_detect:
    - 0
    # Explicit non-person YOLO class IDs allowed to drive safety alerts.
    # Keep empty unless the deployed model/classes have been validated.
    alert_class_ids: []
    alert_min_confidence: 0.9
    enable_tracking: false
  anomaly:
    model_type: patchcore
    threshold: 0.7
    image_size:
    - 256
    - 256
    enable_multiscale: true
    tile_size: 512
    tile_overlap: 0.25
    dinomaly_backbone: dinov2_vitb14
    dinomaly_encoder_layers:
    - 2
    - 5
    - 8
    - 11
    dinomaly_few_shot_images: 8
    dinomaly_multi_class: false
    quantization: fp16
    quantization_calibration_images: 100
    enable_calibration: true
    ssim_baseline_frames: 15
    ssim_sensitivity: 50.0
    ssim_midpoint: 0.015
    ssim_global_change_suppress_fraction: 0.04
    shadow_sample_rate: 5
    warmup_frames: 10
    warmup_max_latency_ms: 500.0
    verify_model_signature: false
    min_shadow_days: 3
    min_shadow_samples: 100
    max_shadow_alert_rate_delta: 0.05
    max_shadow_score_divergence: 0.20
    max_shadow_latency_ms: 1000.0
    min_canary_days: 7
    backbone_max_per_camera: 5000
    backbone_max_total_images: 50000
  simplex:
    enabled: true
    diff_threshold: 30
    min_area_px: 500
    min_static_seconds: 30.0
    morph_kernel_size: 5
    match_radius_px: 50
  persistent_change:
    enabled: true
    process_width: 960
    reference_frames: 30
    diff_threshold: 28
    min_area_px: 250
    max_area_fraction: 0.20
    max_change_fraction: 0.12
    min_persistence_seconds: 2.0
    min_persistence_frames: 5
    learning_alpha: 0.002
    morph_kernel_size: 5
    match_radius_px: 40
    max_missed_frames: 3
    alert_score: 0.82
    max_candidates_per_frame: 5
  static_confirmation:
    enabled: true
    mode: shadow
    sensitive_rois: []
    min_bbox_size: 8
    min_local_mean_abs_difference: 0.025
    changed_pixel_threshold: 0.04
    global_illumination_min_delta: 0.025
    global_changed_fraction_threshold: 0.35
    max_global_model_residual: 0.025
    min_structure_score: 0.30
    sensitive_min_structure_score: 0.55
    external_anomaly_score_threshold: null
    # Candidate-level PatchCore evidence.  Thresholds intentionally stay null
    # until the recorded corpus is calibrated for the exact model/profile ID.
    # Shadow mode records metrics but never changes the production decision.
    model_evidence:
      enabled: true
      fusion_policy: model_required
      calibration_id: null
      global_score_min: null
      roi_p95_min: null
      roi_context_delta_min: null
      context_ratio: 0.5
      hot_pixel_threshold: 0.5
      anomaly_attribution_min_hot_coverage: 1.0
      sample_every_n_candidates: 1
      temporal_required_passes: 2
      temporal_min_gap_seconds: 0.4
      temporal_max_gap_seconds: 2.0
      temporal_iou_threshold: 0.5
  water_leak:
    enabled: false
    process_width: 640
    reference_frames: 15
    diff_threshold: 22
    darkening_threshold: 14
    brightening_threshold: 18
    specular_value_threshold: 180
    specular_saturation_max: 80
    min_area_px: 120
    max_area_fraction: 0.12
    max_change_fraction: 0.08
    min_growth_area_px: 80
    min_persistence_seconds: 1.0
    min_persistence_frames: 3
    min_drip_length_px: 18
    min_vertical_aspect: 2.0
    learning_alpha: 0.001
    morph_kernel_size: 5
    match_radius_px: 50
    max_missed_frames: 5
    alert_score: 0.84
    max_candidates_per_frame: 5
  plume:
    enabled: false
    process_width: 640
    reference_frames: 15
    diff_threshold: 16
    brightening_threshold: 12
    darkening_threshold: 12
    max_saturation: 150
    min_area_px: 180
    max_area_fraction: 0.25
    max_change_fraction: 0.18
    min_growth_area_px: 100
    min_persistence_seconds: 1.0
    min_persistence_frames: 3
    max_edge_density: 0.08
    max_bbox_fill_fraction: 0.90
    learning_alpha: 0.001
    morph_kernel_size: 7
    match_radius_px: 70
    max_missed_frames: 6
    alert_score: 0.83
    max_candidates_per_frame: 5
  usb:
    device_name: OBSBOT Meet 2 StreamCamera
    go2rtc_source: null
    preferred_backend: auto
    pixel_format: mjpeg
    min_runtime_fps: 50.0
  fast_motion:
    enabled: true
    process_width: 960
    diff_threshold: 18
    min_area_px: 2
    max_area_px: 1500
    min_streak_length_px: 4
    min_confidence: 0.60
    max_motion_fraction: 0.015
    max_streak_frame_fraction: 0.25
    streak_gap_px: 4
    instant_alert_score: 0.96
    max_candidates_per_frame: 5
    min_runtime_fps: 50.0
    required_resolution:
    - 1920
    - 1080
  drift:
    enabled: true
    reference_window: 500
    test_window: 100
    p_value_threshold: 0.01
    ks_threshold: 0.1
    cooldown_minutes: 30
  degradation:
    max_consecutive_failures: 5
    refuse_start_on_backbone_failure: false
    watchdog_check_interval_seconds: 15.0
  ring_buffer:
    enabled: true
    pre_trigger_seconds: 60
    post_trigger_seconds: 30
    jpeg_quality: 85
    video_crf: 23
    video_preset: veryfast
    max_recording_age_days: 30
    archive_dir: data/recordings
  low_light:
    enabled: true
    brightness_threshold: 40.0
    fast_motion_recovery_seconds: 2.0
alerts:
  severity_thresholds:
    info: 0.5
    low: 0.7
    medium: 0.85
    high: 0.95
  temporal:
    max_gap_seconds: 10.0
    min_spatial_overlap: 0.3
    evidence_lambda: 0.95
    evidence_threshold: 3.0
    spatial_continuity_enabled: true
    spatial_continuity_iou_threshold: 0.7
    spatial_continuity_mode: reset
    stationary_suppress_enabled: true
    stationary_suppress_after_s: 10.0
  suppression:
    same_zone_window_seconds: 300.0
    same_camera_window_seconds: 60.0
    # Deprecated compatibility value: incident_key (or bbox IoU for legacy
    # callers) now controls localized deduplication. Distinct incidents do not
    # suppress one another, regardless of this value.
    localized_alert_min_interval_seconds: 45.0
  early_warning:
    enabled: true
    score_threshold: 0.95
    require_detection_or_classifier: true
    classifier_min_confidence: 0.9
  calibration:
    enabled: true
    target_fpr_info: 0.1
    target_fpr_low: 0.01
    target_fpr_medium: 0.001
    target_fpr_high: 0.0001
    min_calibration_samples: 50
  zone_multipliers:
    critical: 1.2
    standard: 1.0
    low_priority: 0.8
  webhook:
    enabled: false
    url: ''
    timeout: 5.0
  circuit_breaker_threshold: 5
  circuit_breaker_timeout: 60.0
  category_enabled: true
  enabled_categories:
    - projectile
    - static_foreign
    - scene_change
    - water_leak
    - visible_plume
    - environmental
    - person_intrusion
    - equipment_displacement
auth:
  enabled: false
  api_token: ''
  session_timeout_minutes: 480
debug:
  frame_identity_overlay: false
dashboard:
  host: 127.0.0.1
  port: 8080
  debug: false
  mjpeg_fps: 5.0
  websocket_heartbeat_seconds: 30
  websocket_max_connections: 100
  audio_alerts:
    low:
      enabled: false
      sound: beep_single
      voice_template: ''
    medium:
      enabled: true
      sound: beep_single
      voice_template: ''
    high:
      enabled: true
      sound: beep_double_voice
      voice_template: '{camera} 高级别告警'
  go2rtc_enabled: true
  go2rtc_api_port: 1984
  go2rtc_rtsp_port: 8554
  go2rtc_webrtc_port: 8555
  go2rtc_webrtc_listen_host: 0.0.0.0
  go2rtc_binary: null
  go2rtc_config_dir: null
  go2rtc_replace_stale_process: false
storage:
  database_url: sqlite:///data/db/argus.db
  baselines_dir: data\baselines
  models_dir: data\models
  exports_dir: data\exports
  backbones_dir: data\backbones
  foe_objects_dir: data\foe_objects
  model_packages_dir: data\model_packages
  alerts_dir: data\alerts
  inference_records_dir: data\inference_records
  alert_retention_days: 90
models:
  yolo_path: yolo11n.pt
  anomalib_model_dir: data\models
  anomalib_export_dir: data\exports
logging:
  log_dir: data\logs
  max_file_size_mb: 50
  backup_count: 10
  log_format: json
capture_quality:
  enabled: true
  blur_threshold: 100.0
  blur_adaptive_pct: 0.3
  brightness_min: 30.0
  brightness_max: 225.0
  brightness_std_min: 10.0
  saturated_pixel_max_pct: 0.3
  ssim_dedup_threshold: 0.98
  ssim_resize: 256
  person_confidence: 0.3
  entropy_min: 3.0
classifier:
  # P2 fix (2026-05): default OFF to match README/requirements. Loading
  # YOLO-World pulls a multi-hundred-MB model and changes the alert
  # severity arithmetic; users must opt in explicitly via System →
  # 功能模块.
  enabled: false
  model_name: yolov8s-worldv2.pt
  vocabulary:
  - wrench
  - bolt
  - nut
  - screwdriver
  - hammer
  - rag
  - glove
  - plastic bag
  - tape
  - wire
  - insulation
  - debris
  - paint chip
  - insect
  - bird
  - shadow
  - reflection
  min_anomaly_score_to_classify: 0.5
  high_risk_labels:
  - wrench
  - bolt
  - nut
  - screwdriver
  - hammer
  low_risk_labels:
  - insect
  - shadow
  - reflection
segmenter:
  enabled: false
  model_size: small
  max_points: 5
  min_anomaly_score: 0.7
  min_mask_area_px: 100
  timeout_seconds: 10.0
cross_camera:
  enabled: false
  overlap_pairs: []
  corroboration_threshold: 0.3
  max_age_seconds: 5.0
  uncorroborated_severity_downgrade: 1
retraining:
  enabled: false
  interval_hours: 24
  min_new_baselines: 20
  auto_deploy: false
  auto_deploy_min_grade: B
  backbone_retrain_interval_days: 30
  backbone_type: dinov2_vitb14
  validation_auroc_threshold: 0.99
  validation_recall_threshold: 0.95
  historical_replay_days: 30
  require_human_confirmation: true
  confirmation_timeout_hours: 72
feedback:
  auto_baseline_on_fp: true
  auto_validation_on_confirmed: true
  uncertain_escalation_role: supervisor
  passive_feedback_enabled: true
  validation_dir: data\validation
baseline_capture:
  default_strategy: active
  diversity_threshold: 0.3
  dino_backbone: dinov2_vits14
  dino_image_size: 224
  active_sleep_min_seconds: 1.0
  active_cpu_threads: 1
  schedule_periods:
    dawn:
    - 5
    - 8
    noon:
    - 11
    - 13
    dusk:
    - 16
    - 19
    night:
    - 22
    - 2
  frames_per_period: 50
  pause_on_anomaly_lock: true
  post_capture_review: true
  review_flag_percentile: 0.99
sensor_fusion:
  enabled: false
  default_valid_for_s: 60.0
  gas_warning_ppm: 10.0
  gas_danger_ppm: 50.0
  pressure_drop_warning_kpa: 5.0
  pressure_drop_danger_kpa: 15.0
  humidity_warning_rh: 85.0
  humidity_danger_rh: 95.0
  temperature_warning_c: 70.0
  temperature_danger_c: 90.0
  warning_multiplier: 1.5
  danger_multiplier: 2.5
camera_groups: []
log_level: INFO
